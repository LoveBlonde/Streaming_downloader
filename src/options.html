<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
      .card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
      fieldset { border: 0; padding: 0; margin: 0; }
      legend { font-weight: 600; margin-bottom: 8px; }
      label.opt { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
      .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
      #toast { color: var(--accent); margin-top: 10px; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1 data-i18n="settingsTitle"></h1>
    <div class="card">
      <fieldset id="languages">
        <legend data-i18n="language"></legend>
      </fieldset>
      <div class="hint" data-i18n="languageHint"></div>
      <div id="toast" role="status"></div>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
