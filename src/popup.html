<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      body { width: 420px; padding: 12px; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      header h1 { margin: 0; }
      .icon-btn { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 4px 8px; font-size: 15px; line-height: 1; }
      .item { border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
      .item.included { opacity: 0.7; }
      .head { display: flex; gap: 6px; align-items: flex-start; justify-content: space-between; }
      .name { overflow-wrap: anywhere; min-width: 0; }
      .badge { flex-shrink: 0; background: var(--accent); color: #fff; border-radius: 999px; padding: 0 8px; font-size: 11px; line-height: 18px; }
      .kind { color: var(--accent); font-size: 12px; margin-top: 2px; }
      .note { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .url { font-family: ui-monospace, monospace; font-size: 11px; overflow-wrap: anywhere; color: var(--muted); max-height: 3.6em; overflow: hidden; margin-top: 4px; }
      .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; margin-top: 6px; }
      .empty { color: var(--muted); padding: 12px 0; white-space: pre-line; }
      details { margin-top: 10px; }
      input { width: 100%; margin-top: 6px; }
    </style>
  </head>
  <body>
    <header>
      <h1 data-i18n="popupTitle"></h1>
      <button id="openSettings" class="icon-btn" data-i18n-title="settings">⚙</button>
    </header>
    <div id="list"></div>
    <details>
      <summary data-i18n="manualUrl"></summary>
      <input id="manualUrl" placeholder="https://.../playlist.m3u8" />
      <input id="manualReferer" data-i18n-placeholder="manualRefererPlaceholder" />
      <div class="row"><span></span><button id="manualGo" data-i18n="openDownloader"></button></div>
    </details>
    <script type="module" src="popup.js"></script>
  </body>
</html>
